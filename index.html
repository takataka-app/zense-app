// 年の欄を、半角の数字だけにして返す（全角で打たれても大丈夫）
function readYear() {
  return byInput.value
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))

// その月が何日まであるか（年が未入力の間は、うるう年として扱う）
function daysIn(y, m) {
  if (!m) return 31;
  if (m === 2) {
    const leap = isNaN(y) ? true : ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0);
    return leap ? 29 : 28;
  }
  return [4, 6, 9, 11].includes(m) ? 30 : 31;
}

  for (let d = 1; d <= n; d++) html += '<option value="' + d + '">' + d + "</option>";
  bdSel.innerHTML = html;
  if (keep && parseInt(keep, 10) <= n) bdSel.value = keep;
}

}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// "1892-12-04T00:00:00Z" → "1892年"
function yearOf(s) {
  if (!s) return null;
  const m = s.match(/^(-?\d+)-/);
  if (!m) return null;
  const y = parseInt(m[1], 10);
  return y < 0 ? "紀元前" + Math.abs(y) + "年" : y + "年";
}

// 国の一覧を、省略表記で2つまで「・」でつなぐ（同じ名前になったらまとめる）
function countryText(list) {
  const out = [];
  for (const c of list) {
    const s = shortCountry(c);
    if (!out.includes(s)) out.push(s);
  }
  return out.slice(0, 2).join("・");
}

// 職業が略歴に出てくる度合い（メインの職業を頭に並べるのに使う）
// 職業名そのものが出てくれば2点、「家・者・員・人」を外した言葉が出てくれば1点
function jobScore(job, text) {
  if (text.includes(job)) return 2;
  const stem = job.replace(/(家|者|員|人)$/, "");
  if (stem !== job && stem.length >= 2 && text.includes(stem)) return 1;
  return 0;
}

// 表示用の名前：「アレクサンドル・オストロフスキー (劇作家)」のように、
// カッコの中がその人の職業と同じ時だけカッコを消す
function displayName(name, jobs) {
  const m = name.match(/^(.*?)\s*[（(]([^（）()]*)[）)]\s*$/);
  if (m && jobs.includes(m[2])) return m[1];
  return name;
}

// Wikipedia冒頭文から、（）の中を消して短い略歴にする
function summarize(text) {
  let t = (text || "").replace(/\n/g, "");
  let prev;
  do {
    prev = t;
    t = t.replace(/[（(][^（）()]*[）)]/g, "");
  } while (t !== prev);
  const sents = t.split("。").filter(s => s.trim());
  let out = "";
  for (let i = 0; i < sents.length && i < 3; i++) {
    out += sents[i] + "。";
    if (out.length >= 100) break;
  }
  return out;
}

// 重みつきでオチを1つ選ぶ

  const total = ENDINGS.reduce((s, e) => s + e.weight, 0);
  let r = Math.random() * total;
  for (const e of ENDINGS) {
    r -= e.weight;
    if (r < 0) return e;
  }
  return ENDINGS[0];
}

  let pts = 0;
  if (it.occs.some(q => p.occIds.includes(q))) pts += 2;
  if (it.words.some(w => p.text.includes(w))) pts += 1;
  return pts;
}

// 項目の名前から、共通点の一言を1つ作る（自由入力の言葉にも対応）
function fragOf(m) {
  if (m.startsWith("「")) {
    return pick([
      m + "にも縁のある人でした",
      m + "とも無縁ではない人でした",
      m + "に通じるところのある人でした"
    ]);
  }
  return pick(LINES[m]);
}

// 共通点の文章を作る（内側の理由は見せず、人物像として書く）
// depth = 何番目の前世か（前世=0、前々世=1、三世前=2…）
function makeCommon(p, prev, depth) {
  if (!prev) {
    const adds = ["また、", "さらに、", "加えて、"];
    return p.userMatched.slice(0, 3)
      .map((m, i) => (i === 0 ? "この人も、" : pick(adds)) + fragOf(m) + "。")
      .join("");
  }

  // 世代ごとの言い出しを選ぶ
  const di = Math.max(0, Math.min(depth - 1, LEADS.length - 1));

  // 前の人生にもあなたにも当たった項目は、1つにまとめる
  const both = p.userMatched.filter(m => p.chainMatched.includes(m));
  const chainOnly = p.chainMatched.filter(m => !both.includes(m));
  const userOnly = p.userMatched.filter(m => !both.includes(m));

  // 文の材料を、優先順に並べる
  const items = [];
  if (both.length > 0) items.push({ type: "both", frag: fragOf(both[0]) });
  if (p.sameJob) items.push({ type: "job" });
  if (chainOnly.length > 0) items.push({ type: "chain", frag: fragOf(chainOnly[0]) });
  if (userOnly.length > 0) items.push({ type: "user", frag: fragOf(userOnly[0]) });

  // 1文目は世代ごとの言い出し。2文目からは「また、」「さらに、」
  const adds = ["また、", "さらに、"];
  return items.slice(0, MAX_LINES_LATER).map((it, i) => {
    if (i === 0) {
      if (it.type === "both") return LEADS[di] + "あなたとも通じる、" + it.frag + "。";
      if (it.type === "job") return JOB_LINES[di];
      if (it.type === "chain") return LEADS[di] + it.frag + "。";
      return pick(["あなたと同じく、", "あなたにも通じる、"]) + it.frag + "。";
    }
    const add = adds[i - 1] || "そして、";
    if (it.type === "both") return add + "あなたにも通じる、" + it.frag + "。";
    if (it.type === "job") return add + pick(["同じ道を歩んだ人でした。", "同じ職に生きた人でした。"]);
    if (it.type === "chain") return add + it.frag + "。";
    return add + "あなたと同じく、" + it.frag + "。";
  }).join("");
}

// 日本語Wikipediaの冒頭文を、まとめて取ってくる
async function fetchIntros(titles) {
  const byTitle = {};
  for (let i = 0; i < titles.length; i += 20) {
    const chunk = titles.slice(i, i + 20);
    const url = "https://ja.wikipedia.org/w/api.php?action=query&prop=extracts"
      + "&exintro=1&explaintext=1&exlimit=20&redirects=1&format=json&origin=*"
      + "&titles=" + encodeURIComponent(chunk.join("|"));
    const res = await fetch(url);
    const data = await res.json();
    const q = data.query || {};
    for (const pg of Object.values(q.pages || {})) {
      byTitle[pg.title] = pg.extract || "";
    }
    // 転送・表記ゆれで題名が変わった分をつなぐ（転送 → 正規化の順）
    for (const r of (q.redirects || [])) {
      if (byTitle[r.to] !== undefined) byTitle[r.from] = byTitle[r.to];
    }
    for (const n of (q.normalized || [])) {
      if (byTitle[n.to] !== undefined) byTitle[n.from] = byTitle[n.to];
    }
  }
  return byTitle;
}

// クリップボードにコピー（だめなら昔ながらの方法で）
async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e2) {
      return false;
    }
  }
}

// ===== 状態 =====
let sel = null;     // 今回の入力（誕生日・ニックネーム・選んだ項目・自由入力）
let chain = [];     // 出てきた人（または人間じゃなかったオチ）を順番に入れる
let busy = false;

// ===== 前世を1人探す（見つからなければ null） =====
async function findLife(baseDay, prev, depth) {
  const start = addDays(baseDay, -49);
  const end = addDays(baseDay, -1);

  const query = `
    SELECT ?p ?jaTitle ?death ?birthDate ?bprec ?occ ?occLabel ?citLabel ?sexLabel WHERE {
      ?p wdt:P31 wd:Q5;
         wikibase:sitelinks ?sl;
         p:P570/psv:P570 ?dv.
      ?dv wikibase:timeValue ?death;
          wikibase:timePrecision ?prec.
      ?article schema:about ?p;
               schema:isPartOf <https://ja.wikipedia.org/>;
               schema:name ?jaTitle.
      FILTER(?prec = 11)
      FILTER(?death >= "${start}T00:00:00Z"^^xsd:dateTime &&
             ?death <= "${end}T23:59:59Z"^^xsd:dateTime)
      FILTER(?sl > ${MIN_SITELINKS})
      OPTIONAL { ?p p:P569/psv:P569 ?bv.
                 ?bv wikibase:timeValue ?birthDate;
                     wikibase:timePrecision ?bprec. }
      OPTIONAL { ?p wdt:P106 ?occ. }
      OPTIONAL { ?p wdt:P27 ?cit. }
      OPTIONAL { ?p wdt:P21 ?sex. }
      SERVICE wikibase:label { bd:serviceParam wikibase:language "ja". }
    }`;

  const url = "https://query.wikidata.org/sparql?format=json&query="
            + encodeURIComponent(query);
  const res = await fetch(url);
  const data = await res.json();
  const rows = data.results.bindings;

  // 人ごとにまとめる
  const people = {};
  for (const r of rows) {
    const id = r.p.value;
    if (!people[id]) {
      people[id] = {
        name: r.jaTitle.value,
        death: r.death.value,
        birth: null,
        birthDay: null,   // 日まで分かってる誕生日（次の前世を探す起点）
        jobs: [],
        occIds: [],
        countries: [],
        sex: null
      };
    }
    const p = people[id];
    if (r.birthDate) {
      const bv = r.birthDate.value;
      if (!p.birth) p.birth = bv;
      if (!p.birthDay && r.bprec && r.bprec.value === "11" && /^\d{4}-\d{2}-\d{2}/.test(bv)) {
        p.birthDay = bv.slice(0, 10);
      }
    }
    // 日本語名が無いもの（Q番号のまま出るもの）は表示しない
    if (r.occLabel && !/^Q\d+$/.test(r.occLabel.value) && !p.jobs.includes(r.occLabel.value)) {
      p.jobs.push(r.occLabel.value);
    }
    if (r.occ) {
      const q = r.occ.value.split("/").pop();
      if (!p.occIds.includes(q)) p.occIds.push(q);
    }
    if (r.citLabel && !/^Q\d+$/.test(r.citLabel.value) && !p.countries.includes(r.citLabel.value)) {
      p.countries.push(r.citLabel.value);
    }
    if (!p.sex && r.sexLabel && !/^Q\d+$/.test(r.sexLabel.value)) {
      p.sex = r.sexLabel.value;
    }
  }

  const list = Object.values(people);
  if (list.length === 0) return null;

  // 冒頭文を取ってくる（失敗しても職業マッチだけで続行）
  let intros = {};
  try {
    intros = await fetchIntros(list.map(p => p.name));
  } catch (e) {
    intros = {};
  }
  for (const p of list) {
    p.text = intros[p.name] || "";
    // 略歴に出てくる職業を先頭に並べる（メインの職業が頭に来やすくなる）
    p.jobs.sort((a, b) => jobScore(b, p.text) - jobScore(a, p.text));
  }

  // 点数をつける
  const uw = prev ? USER_WEIGHT_LATER : USER_WEIGHT_FIRST;
  for (const p of list) {
    p.score = 0;
    p.userMatched = [];
    p.chainMatched = [];
    p.sameJob = false;

    // あなたの選択
    for (const c of sel.chosen) {
      const pts = matchItem(c, p);
      if (pts > 0) { p.score += pts * uw; p.userMatched.push(c.name); }
    }
    for (const t of sel.terms) {
      if (p.text.includes(t) || p.jobs.some(j => j.includes(t))) {
        p.score += 1 * uw;
        p.userMatched.push("「" + t + "」");
      }
    }

    // ひとつ前の人生との繋がり
    if (prev) {
      for (const it of ALL_ITEMS) {
        if (!prev.traits.includes(it.name)) continue;
        const pts = matchItem(it, p);
        if (pts > 0) { p.score += pts * CHAIN_WEIGHT; p.chainMatched.push(it.name); }
      }
      const shared = p.occIds.filter(q => prev.occIds.includes(q)).length;
      if (shared > 0) {
        p.score += Math.min(shared, 2) * 2 * CHAIN_WEIGHT;
        p.sameJob = true;
      }
    }
  }

  // 誰にも当たらなかったら null（人間じゃなかったオチへ）
  const best = Math.max(...list.map(p => p.score));
  if (best <= 0) return null;

  // 一番高い人たちからランダムに1人
  const pool = list.filter(p => p.score === best);
  const chosenOne = pool[Math.floor(Math.random() * pool.length)];

  const n = Math.max(1, Math.min(Math.round(chosenOne.score), 5));

  return {
    kind: "person",
    name: chosenOne.name,
    shown: displayName(chosenOne.name, chosenOne.jobs),
    url: "https://ja.wikipedia.org/wiki/" + encodeURIComponent(chosenOne.name.replace(/ /g, "_")),
    by: yearOf(chosenOne.birth),
    dy: yearOf(chosenOne.death),
    jobs: chosenOne.jobs,
    countries: chosenOne.countries,
    sex: chosenOne.sex,
    summary: summarize(chosenOne.text),
    common: makeCommon(chosenOne, prev, depth),
    stars: "★".repeat(n) + "☆".repeat(5 - n),
    birthDay: chosenOne.birthDay,
    occIds: chosenOne.occIds,
    text: chosenOne.text,
    // この人がどの項目に当てはまるか（次の前世を選ぶ手がかり）
    traits: ALL_ITEMS.filter(it => matchItem(it, chosenOne) > 0).map(it => it.name)
  };
}

// ===== 画面に出す =====
function addCard(life) {
  const country = life.countries.length ? life.countries.slice(0, 2).join("・") : "不明";
  const sex = life.sex || "不明";
  const credit = '<br><span class="credit">略歴：<a href="' + esc(life.url)
    + '" target="_blank" rel="noopener">日本語版Wikipedia</a>より（CC BY-SA 4.0、一部省略）</span>';
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML =
    "<h2>あなたの" + esc(life.label) + "は「" + esc(life.shown) + "」</h2>" +
    '<p class="meta">国籍：' + esc(country) + "　性別：" + esc(sex) + "</p>" +
    "<p>相性：" + life.stars + "</p>" +
    "<p>" + esc(life.common) + "</p>" +
    "<p>" + (life.by || "生年不明") + "生まれ 〜 " + (life.dy || "没年不明") + "没</p>" +
    "<p>職業：" + esc(life.jobs.slice(0, 5).join("、") || "不明") + "</p>" +
    (life.summary ? "<p>" + esc(life.summary) + credit + "</p>" : "");
  cardsDiv.appendChild(div);
}

function addEndingCard(label, e) {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML =
    "<h2>" + esc(label) + "は人間ではありませんでした</h2>" +
    "<p>あなたの" + esc(label) + "は、" + esc(e.text) + "</p>";
  cardsDiv.appendChild(div);
}

// 前世リストの見出し（コピー用は「私の前世リスト」）
function listTitle(forCopy) {
  if (sel.nick) return sel.nick + "の前世リスト";
  return forCopy ? "私の前世リスト" : "あなたの前世リスト";
}

function renderList() {
  const rows = [];
  rows.push(["現世", (sel.nick || "自分") + "　" + yearOf(sel.birth) + "〜"]);
  for (const c of chain) {
    if (c.kind === "person") {
      const country = c.countries.length ? "（" + countryText(c.countries) + "）" : "";
      rows.push([
        c.label,
        c.shown + country + "　" + (c.by || "生年不明") + "〜" + (c.dy || "没年不明")
          + (c.jobs.length ? "　" + c.jobs.slice(0, 2).join("、") : "")
      ]);
    } else {
      rows.push([c.label, c.short]);
    }
  }
  // 辿った国の流れ（国は2つまで、省略表記）
  const route = chain.map(c => c.kind === "person"
    ? (c.countries.length ? countryText(c.countries) : "国不明")
    : c.short);
  const routeText = "辿った国：" + route.join(" → ");

  // コピー用の文章
  const copyBody = listTitle(true) + "\n"
    + rows.map(r => r[0] + "　" + r[1]).join("\n") + "\n"
    + routeText;

  listDiv.innerHTML =
    "<h3>" + esc(listTitle(false)) + "</h3><table>" +
    rows.map(r => "<tr><td>" + esc(r[0]) + "</td><td>" + esc(r[1]) + "</td></tr>").join("") +
    "</table>" +
    "<p>" + esc(routeText) + "</p>" +
    '<button id="copy">リストをコピー</button>';

  const btn = document.getElementById("copy");
  btn.onclick = async () => {
    const ok = await copyText(copyBody);
    btn.textContent = ok ? "コピーしたで！" : "コピーできんかった…";
    setTimeout(() => { btn.textContent = "リストをコピー"; }, 2000);
  };
}

// ===== 1段さかのぼる =====
async function step(baseDay, prev) {
  if (busy) return;
  busy = true;
  statusDiv.textContent = SEARCHING_TEXT;
  moreBtn.style.display = "none";
  try {
    // 起点の誕生日が日まで分からん時は、そこで終わり
    const life = baseDay ? await findLife(baseDay, prev, chain.length) : null;
    const label = genLabel(chain.length);
    if (life) {
      life.label = label;
      chain.push(life);
      addCard(life);
      moreBtn.style.display = "";
    } else {
      const e = pickEnding();
      chain.push({ kind: "ending", label: label, short: e.label });
      addEndingCard(label, e);
    }
    statusDiv.textContent = "";
    renderList();
  } catch (e) {
    statusDiv.textContent = "エラー: " + e;
    const last = chain[chain.length - 1];
    if (last && last.kind === "person") moreBtn.style.display = "";
  } finally {
    busy = false;
  }
}

// ===== 占う（最初から） =====
document.getElementById("go").onclick = () => {
    sendLog("占い");
  if (busy) return;
    const yearNum = parseInt(readYear(), 10);
  if (!yearNum || yearNum < 1900 || yearNum > new Date().getFullYear()) {
    msgDiv.textContent = "生まれた年を確認してや（1900年〜今年）";
    return;
  }
  const birth = getBirth();
  if (!birth) {
    msgDiv.textContent = "誕生日を入れてや";
    return;
  }

  // 選ばれた項目を集める
  const chosen = [];
  for (const cb of document.querySelectorAll("#form input[type=checkbox]:checked")) {
    const g = GROUPS.find(x => x.id === cb.dataset.group);
    chosen.push({ name: cb.value, occs: g.items[cb.value].occs, words: g.items[cb.value].words });
  }
  // 自由入力を集める
  const terms = [];
  for (const g of GROUPS) {
    if (!g.detail) continue;
    const v = document.getElementById("detail-" + g.id).value;
    v.split(/[、,，\s]+/).filter(Boolean).forEach(t => terms.push(t));
  }

  // 何も選んでない時は占えない
  if (chosen.length === 0 && terms.length === 0) {
    msgDiv.textContent = "趣味か性格を、ひとつは選んでや";
    return;
  }

  // 最初からやり直し
  msgDiv.textContent = "";
  sel = {
    birth: birth,
    nick: document.getElementById("nick").value.trim(),
    chosen: chosen,
    terms: terms
  };
  chain = [];
  cardsDiv.innerHTML = "";
  listDiv.innerHTML = "";
  moreBtn.style.display = "none";

  step(birth, null);
};

// ===== もっと前の前世を見る =====
moreBtn.onclick = () => {
  const last = chain[chain.length - 1];
  if (!last || last.kind !== "person") return;
  step(last.birthDay, last);
};
